name: Android13 VendorBoot Recovery Builder

on:
  workflow_dispatch:
    inputs:

      MANIFEST_BRANCH:
        description: 'Android Branch'
        required: true
        default: 'thirteen'
        type: choice
        options:
        - thirteen
        - thirteen-plus

      ROM_MANIFEST:
        description: 'ROM Manifest URL'
        required: true
        default: 'https://github.com/PixelExperience/manifest'

      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/r3nzph/twrp-device_tecno_TECNO-KJ5-v2001.git'

      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'Prebuilt'

      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/tecno/KJ5'

      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'KJ5'

      LUNCH_TARGET:
        description: 'Lunch Target'
        required: true
        default: 'aosp_KJ5-userdebug'

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorbootimage'
        type: choice
        options:
        - vendorbootimage
        - recoveryimage
        - bootimage

      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'

      MAKE_CLEAN:
        description: 'Run make clean'
        required: true
        default: false
        type: boolean

      ENABLE_CCACHE:
        description: 'Enable CCache'
        required: true
        default: true
        type: boolean

      RECOVERY_TAR:
        description: 'Release recovery.tar'
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

      FASTBOOT_PACKAGE:
        description: 'Create fastboot package'
        required: true
        default: true
        type: boolean

      TELEGRAM_UPLOAD:
        description: 'Upload to Telegram'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build Recovery by ${{ github.actor }}

    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALLOW_MISSING_DEPENDENCIES: true
      USE_CCACHE: 1
      CCACHE_DIR: /tmp/ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "1"
      CCACHE_MAXSIZE: 15G

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    # DISPLAY INPUTS
    - name: Display Inputs
      run: |
        echo "::group::Inputs"

        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Lunch Target: ${{ github.event.inputs.LUNCH_TARGET }}"
        echo "Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Fastboot Package: ${{ github.event.inputs.FASTBOOT_PACKAGE }}"
        echo "Telegram Upload: ${{ github.event.inputs.TELEGRAM_UPLOAD }}"

        echo "::endgroup::"

    # CLEANUP
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    # EXTRA CLEANUP
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL

        sudo docker system prune -af

        sudo apt clean

        df -h

    # SWAP
    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    # BUILD ENVIRONMENT
    - name: Build Environment
      run: |
        sudo apt update

        sudo apt install -y \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses6 lib32z1 liblz4-tool \
          x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig \
          openjdk-11-jdk python3 python-is-python3 \
          adb fastboot ccache jq aria2 rsync \
          bc bison gperf imagemagick \
          lib32readline-dev libncurses5-dev \
          libsdl1.2-dev libssl-dev lzop pngcrush \
          schedtool squashfs-tools zip zlib1g-dev

        # REPO TOOL
        mkdir -p ~/bin

        curl -fsSL \
        https://storage.googleapis.com/git-repo-downloads/repo \
        > ~/bin/repo

        chmod a+x ~/bin/repo

        echo "$HOME/bin" >> $GITHUB_PATH

        # GIT OPTIMIZATION
        git config --global color.ui false
        git config --global core.compression 0
        git config --global http.postBuffer 157286400
        git config --global gc.auto 1024

    # CCACHE
    - name: Restore CCache
      if: github.event.inputs.ENABLE_CCACHE == 'true'
      uses: actions/cache@v4
      with:
        path: /tmp/ccache
        key: ccache-${{ github.run_id }}
        restore-keys: |
          ccache-

    # INITIALIZE SOURCE
    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/workspace

        cd ${GITHUB_WORKSPACE}/workspace

        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"

        repo init \
          --depth=1 \
          --no-repo-verify \
          -u ${{ github.event.inputs.ROM_MANIFEST }} \
          -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    # FAST SYNC
    - name: Sync Sources
      run: |
        cd ${GITHUB_WORKSPACE}/workspace

        repo sync -c \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --prune \
          --force-sync \
          -j$(nproc --all)

    # DEVICE TREE
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/workspace

        git clone \
        --depth=1 \
        ${{ github.event.inputs.DEVICE_TREE }} \
        -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
        ./${{ github.event.inputs.DEVICE_PATH }}

        cd ${{ github.event.inputs.DEVICE_PATH }}

        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    # OPTIONAL CLEAN
    - name: Optional Make Clean
      if: github.event.inputs.MAKE_CLEAN == 'true'
      run: |
        cd ${GITHUB_WORKSPACE}/workspace

        source build/envsetup.sh

        lunch ${{ github.event.inputs.LUNCH_TARGET }}

        make clean

    # BUILD
    - name: Build Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/workspace

        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export USE_CCACHE=1

        ccache -M 15G

        source build/envsetup.sh

        lunch ${{ github.event.inputs.LUNCH_TARGET }}

        mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

    # BUILD DATE
    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

    # CHECK OUTPUT
    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/workspace

        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img ]; then

            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV

            echo "FILE_PATH=${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV

            echo "OUTPUT=vendor_boot.img" >> $GITHUB_ENV

        elif [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img ]; then

            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV

            echo "FILE_PATH=${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV

            echo "OUTPUT=recovery.img" >> $GITHUB_ENV

        elif [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img ]; then

            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV

            echo "FILE_PATH=${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV

            echo "OUTPUT=boot.img" >> $GITHUB_ENV

        else
            echo "Recovery output not found."
            exit 1
        fi

    # MD5
    - name: Generate MD5
      run: |
        cd ${{ env.FILE_PATH }}

        md5sum ${{ env.OUTPUT }} | cut -d ' ' -f 1 > md5.txt

        echo "MD5_IMG=$(cat md5.txt)" >> $GITHUB_ENV

    # RECOVERY INSTALLER
    - name: Include Recovery Installer
      if: github.event.inputs.RECOVERY_INSTALLER == 'true'
      run: |
        cd ${{ env.FILE_PATH }}

        wget -O recovery-installer.zip \
        https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip

        zip -ur recovery-installer.zip ${{ env.OUTPUT }}

      continue-on-error: true

    # FASTBOOT PACKAGE
    - name: Create Fastboot Package
      if: github.event.inputs.FASTBOOT_PACKAGE == 'true'
      run: |
        cd ${{ env.FILE_PATH }}

        mkdir -p fastboot_package

        cp ${{ env.OUTPUT }} fastboot_package/

        echo "fastboot flash vendor_boot ${{ env.OUTPUT }}" \
        > fastboot_package/flash-linux.sh

        echo "fastboot flash vendor_boot ${{ env.OUTPUT }}" \
        > fastboot_package/flash-windows.bat

        chmod +x fastboot_package/flash-linux.sh

        zip -r9 fastboot_package.zip fastboot_package

      continue-on-error: true

    # TAR
    - name: Recovery to tar
      if: github.event.inputs.RECOVERY_TAR == 'true'
      run: |
        cd ${{ env.FILE_PATH }}

        tar -cvf recovery.tar ${{ env.OUTPUT }}

      continue-on-error: true

    # ANYKERNEL3
    - name: Create Flashable ZIP
      run: |
        cd ${GITHUB_WORKSPACE}

        git clone \
        --depth=1 \
        https://github.com/osm0sis/AnyKernel3.git

        cp ${{ env.FILE_PATH }}/${{ env.OUTPUT }} \
        AnyKernel3/

        cd AnyKernel3

        zip -r9 Recovery-Flashable.zip * \
        -x .git README.md LICENSE

        mv Recovery-Flashable.zip \
        ${{ env.FILE_PATH }}/

      continue-on-error: true

    # TELEGRAM
    - name: Upload to Telegram
      if: github.event.inputs.TELEGRAM_UPLOAD == 'true'
      run: |
        cd ${{ env.FILE_PATH }}

        for file in *; do

          curl -F document=@"$file" \
          "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"

        done

      continue-on-error: true

    # RELEASE
    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v2

      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.OUTPUT }}
          ${{ env.FILE_PATH }}/recovery.tar
          ${{ env.FILE_PATH }}/recovery-installer.zip
          ${{ env.FILE_PATH }}/Recovery-Flashable.zip
          ${{ env.FILE_PATH }}/fastboot_package.zip
          ${{ env.FILE_PATH }}/md5.txt

        name: |
          Android13-Recovery-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}

        tag_name: ${{ github.run_id }}

        body: |
          # Android 13 VendorBoot Recovery

          ### Device:
          TECNO-${{ github.event.inputs.DEVICE_NAME }}

          ---

          ## Build Information

          - Build Date:
            `${{ env.BUILD_DATE }}`

          - Android Branch:
            `${{ github.event.inputs.MANIFEST_BRANCH }}`

          - Build Type:
            `${{ github.event.inputs.BUILD_TARGET }}`

          - Lunch Target:
            `${{ github.event.inputs.LUNCH_TARGET }}`

          ---

          ## Source Information

          - Device Tree:
            ${{ github.event.inputs.DEVICE_TREE }}

          - Branch:
            `${{ github.event.inputs.DEVICE_TREE_BRANCH }}`

          - Commit:
            `${{ env.COMMIT_ID }}`

          ---

          ## Included Files

          ✅ Recovery Image

          ✅ Recovery Installer

          ✅ Fastboot Package

          ✅ Flashable ZIP

          ✅ MD5 Hashes

          ---

          ## Flash Command

          ```bash
          fastboot flash vendor_boot vendor_boot.img
          ```

          ---

          MD5:
          `${{ env.MD5_IMG }}`

          ---

          Automated GitHub Actions build.

    # LDCHECK
    - name: Run LDCheck
      run: |
        cd tools || exit 0

        mv -n libneeds ${{ env.FILE_PATH }}/recovery/root/ || true
        mv -n ldcheck ${{ env.FILE_PATH }}/recovery/root/ || true

        cd ${{ env.FILE_PATH }}/recovery/root/ || exit 0

        python3 ldcheck \
        -p system/lib64:vendor/lib64:system/lib:vendor/lib \
        -d ${{ github.event.inputs.LDCHECK }}

      continue-on-error: true
